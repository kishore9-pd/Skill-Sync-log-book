services:
  - type: web
    name: techwing-daily-logbook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: ADMIN_EMAIL
        value: "penugondakishore2006@gmail.com"
      - key: DATABASE_URL
        fromDatabase:
          name: techwing-daily-log-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1

databases:
  - name: techwing-daily-log-db
    plan: free
